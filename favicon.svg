<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hojas verdes de fondo -->
  <path d="M50 50 Q 20 90 10 70 Q 20 40 50 50" fill="#228B22" />
  <path d="M50 50 Q 80 90 90 70 Q 80 40 50 50" fill="#228B22" />
  
  <!-- Pétalos amarillos -->
  <g fill="#FFD700">
    <ellipse cx="50" cy="25" rx="14" ry="25" transform="rotate(0 50 50)"/>
    <ellipse cx="50" cy="25" rx="14" ry="25" transform="rotate(45 50 50)"/>
    <ellipse cx="50" cy="25" rx="14" ry="25" transform="rotate(90 50 50)"/>
    <ellipse cx="50" cy="25" rx="14" ry="25" transform="rotate(135 50 50)"/>
    <ellipse cx="50" cy="25" rx="14" ry="25" transform="rotate(180 50 50)"/>
    <ellipse cx="50" cy="25" rx="14" ry="25" transform="rotate(225 50 50)"/>
    <ellipse cx="50" cy="25" rx="14" ry="25" transform="rotate(270 50 50)"/>
    <ellipse cx="50" cy="25" rx="14" ry="25" transform="rotate(315 50 50)"/>
  </g>
  
  <!-- Centro de la flor -->
  <circle cx="50" cy="50" r="16" fill="#FFA500"/>
  <circle cx="50" cy="50" r="10" fill="#FF8C00"/>
</svg>
